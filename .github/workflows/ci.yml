name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint (nixfmt, biome, ripsecrets via git-hooks.nix), build, typecheck, test with coverage,
  # Home Manager module check: everything the flake defines, on Linux and macOS.
  nix:
    name: nix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Flake checks (hooks, unit tests, module check)
        run: nix flake check --print-build-logs
      - name: Build the package
        run: nix build .#default --print-build-logs
      - name: Integration tests (real khal from the dev shell, temporary directories only)
        run: |
          nix develop --command npm ci --ignore-scripts
          nix develop --command npm run test:integration
      - name: Smoke test the built binary
        run: |
          rc=0
          ./result/bin/mcp-khal --bogus || rc=$?
          test "$rc" -eq 2

  # Fast feedback without Nix: plain npm build, typecheck and tests.
  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check commit messages
        run: nix run nixpkgs#convco -- check "origin/${{ github.base_ref }}..HEAD"

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nix, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Pack
        run: npm pack
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}" \
            ./*.tgz
